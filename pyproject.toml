[project]
name = "prime-workshop"
version = "0.1.0"
description = "Практикум Л9: из ноутбука в команду prime report"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime"]
